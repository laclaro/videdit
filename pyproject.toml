[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videdit"
version = "0.1.0"
description = "Convert camera videos with ffmpeg and file them next to the matching photo"
authors = [{ name = "Henning Hollermann" }]
requires-python = ">=3.10"
dependencies = ["exifread>=3"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest>=7"]

[project.scripts]
videdit = "videdit.cli:main"

[project.gui-scripts]
videdit-gui = "videdit.gui.app:main"

[tool.setuptools.packages.find]
include = ["videdit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
